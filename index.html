<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jeevan S — UI/UX Designer & Creative Developer</title>

    <!-- Meta Tags -->
    <meta name="description"
        content="Portfolio of Jeevan S — Graphic Designer @ IEEE SPS KC, Deputy CFA @ FOSS CEAL, CREATE101 Lead @ CEAL, Webmaster @ IEEE SBC SB CEAL & WebTeam member @ AlchemyIEDC CEAL.">
    <meta name="author" content="Jeevan S">
    <meta name="theme-color" content="#38bdf8">

    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></scrip

        };
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/scrollreveal"></script>

    <!-- Modular Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="selection:bg-sky-300 dark:selection:bg-sky-600 bg-white dark:bg-[#0a0a0a] text-black dark:text-white transition-colors duration-300">
    <div id="noise-overlay"></div>
    <div class="scanline"></div>

    <!-- Navigation -->
    <nav
        class="fixed top-0 w-full z-[100] border-b-4 border-black dark:border-white bg-white/90 dark:bg-[#0a0a0a]/90 backdrop-blur-md transition-colors duration-300">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 h-20 flex justify-between items-center">
            <!-- Brand Logo -->
            <a href="#hero" class="flex items-center gap-2 group" aria-label="Jeevan S Home">
                <img src="Assets/JS LOGO.svg" alt="Jeevan S Logo"
                    class="h-9 sm:h-10 w-auto filter dark:invert transition-all duration-300 group-hover:scale-105"
                    onerror="this.src='jslogo.svg'">
            </a>

            <!-- Desktop Nav Links & Controls -->
            <div class="hidden md:flex items-center gap-4 font-bold uppercase tracking-tighter text-sm lg:text-base">
                <a href="#about"
                    class="px-3.5 py-2 hover:bg-sky-400 dark:hover:bg-sky-400 hover:text-black border-2 border-transparent hover:border-black dark:hover:border-white transition-all">About</a>
                <a href="#skills"
                    class="px-3.5 py-2 hover:bg-sky-400 dark:hover:bg-sky-400 hover:text-black border-2 border-transparent hover:border-black dark:hover:border-white transition-all">Skills</a>
                <a href="#tech-projects"
                    class="px-3.5 py-2 hover:bg-sky-400 dark:hover:bg-sky-400 hover:text-black border-2 border-transparent hover:border-black dark:hover:border-white transition-all">Projects</a>
                <a href="#projects"
                    class="px-3.5 py-2 hover:bg-sky-400 dark:hover:bg-sky-400 hover:text-black border-2 border-transparent hover:border-black dark:hover:border-white transition-all">Posters</a>
                <a href="#experience"
                    class="px-3.5 py-2 hover:bg-sky-400 dark:hover:bg-sky-400 hover:text-black border-2 border-transparent hover:border-black dark:hover:border-white transition-all">Journey</a>

                <!-- Dark Mode Toggle Button -->
                <button
                    class="theme-toggle-btn border-2 border-black dark:border-white p-2 bg-white dark:bg-black text-black dark:text-white hover:bg-sky-400 dark:hover:bg-sky-400 dark:hover:text-black transition-all brutal-shadow-small"
                    aria-label="Toggle dark mode" title="Toggle dark mode">
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>

                <a id="nav-cta" href="#contact"
                    class="bg-black text-white dark:bg-white dark:text-black px-5 lg:px-6 py-2 border-2 border-black dark:border-white hover:bg-white hover:text-black dark:hover:bg-black dark:hover:text-white transition-all shadow-[4px_4px_0_0_#38bdf8]">Let's
                    Talk</a>
            </div>

            <!-- Mobile Controls -->
            <div class="flex md:hidden items-center gap-2.5">
                <button
                    class="theme-toggle-btn border-2 border-black dark:border-white p-2 bg-white dark:bg-black text-black dark:text-white"
                    aria-label="Toggle theme">
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>

                <button class="border-3 sm:border-4 border-black dark:border-white p-2 bg-sky-400 text-black"
                    onclick="document.getElementById('mobile-nav').classList.toggle('hidden')"
                    aria-label="Open navigation menu">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Navigation Overlay -->
    <div id="mobile-nav"
        class="hidden fixed inset-0 z-[200] bg-sky-400 text-black flex flex-col items-center justify-center gap-7 font-black text-3xl uppercase border-8 border-black">
        <button class="absolute top-6 right-6 p-2"
            onclick="document.getElementById('mobile-nav').classList.add('hidden')" aria-label="Close menu">
            <i data-lucide="x" class="w-10 h-10"></i>
        </button>
        <a href="#about" onclick="document.getElementById('mobile-nav').classList.add('hidden')">About</a>
        <a href="#skills" onclick="document.getElementById('mobile-nav').classList.add('hidden')">Skills</a>
        <a href="#tech-projects" onclick="document.getElementById('mobile-nav').classList.add('hidden')">Projects</a>
        <a href="#projects" onclick="document.getElementById('mobile-nav').classList.add('hidden')">Posters</a>
        <a href="#experience" onclick="document.getElementById('mobile-nav').classList.add('hidden')">Journey</a>
        <a href="#contact" onclick="document.getElementById('mobile-nav').classList.add('hidden')">Contact</a>
    </div>

    <main>
        <!-- Hero Section -->
        <section id="hero"
            class="min-h-screen flex flex-col justify-center items-center relative section-padding pt-32 text-center bg-white dark:bg-[#0a0a0a] overflow-hidden transition-colors duration-300">
            <div class="absolute inset-0 opacity-5 pointer-events-none"
                style="background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 20px 20px;">
            </div>

            <!-- Decorative Floating Elements -->
            <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-[0.05]">
                <div class="absolute top-[10%] left-[5%] w-64 h-64 border-8 border-current animate-float-slow"></div>
                <div
                    class="absolute bottom-[15%] right-[10%] w-48 h-48 border-8 border-current rounded-full animate-float-delayed">
                </div>
                <div class="absolute top-[25%] right-[5%] text-[180px] font-black animate-spin-very-slow select-none">+
                </div>
                <div
                    class="absolute bottom-[5%] left-[15%] w-32 h-32 border-t-8 border-l-8 border-current animate-float-slow">
                </div>
                <div class="absolute top-[50%] left-[2%] w-10 h-10 bg-current animate-pulse"></div>
            </div>

            <div class="relative z-10 max-w-5xl scroll-skew px-4">
                <div
                    class="mb-6 inline-block bg-sky-400 text-black border-3 sm:border-4 border-black dark:border-white px-4 py-1 font-black uppercase text-xs sm:text-sm brutal-shadow reveal-text active">
                    👋 Available for projects & collaborations
                </div>

                <h1
                    class="text-4xl sm:text-6xl md:text-8xl lg:text-[105px] font-black uppercase leading-[0.92] tracking-tighter mb-8 reveal-text active">
                    DESIGNING <br> <span
                        class="bg-black text-white dark:bg-white dark:text-black px-3 sm:px-4">MEANINGFUL</span>
                    EXPERIENCES
                </h1>

                <p
    </main>
</body>
</html>
